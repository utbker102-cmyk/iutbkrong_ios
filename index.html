<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Y UT BKRONG — Official Bio</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(236,72,153,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(124,58,237,.16),
            transparent 30%
        ),
        #050505;

    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}

.glow{
    position:absolute;
    width:360px;
    height:360px;

    border-radius:50%;

    filter:blur(110px);

    opacity:.18;
}

.glow-one{
    background:#ec4899;

    top:-180px;
    left:-150px;
}

.glow-two{
    background:#7c3aed;

    right:-170px;
    bottom:-160px;
}


/* =========================
   BIO CARD
========================= */

.card{

    position:relative;
    z-index:5;

    width:100%;
    max-width:440px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.085),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    box-shadow:
        0 40px 100px rgba(0,0,0,.7),
        inset 0 1px rgba(255,255,255,.07);
}


/* =========================
   LOGO U
========================= */

.logo{

    position:relative;

    width:132px;
    height:132px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#07070a;

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 35px rgba(255,255,255,.08),
        0 0 70px rgba(236,72,153,.15);

    overflow:hidden;
}

.logo::before{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:50%;

    padding:2px;

    background:
        conic-gradient(
            #ec4899,
            #ffffff,
            #8b5cf6,
            #ec4899
        );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    animation:
        spin 8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

.logo-u{

    position:relative;

    z-index:2;

    font-family:'Space Grotesk',sans-serif;

    font-size:78px;

    font-weight:600;

    color:white;

    text-shadow:
        0 0 15px rgba(255,255,255,.35),
        0 0 35px rgba(236,72,153,.20);
}


/* =========================
   ONLINE
========================= */

.online{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:6px 11px;

    margin-top:24px;

    border-radius:50px;

    border:
        1px solid rgba(74,222,128,.15);

    background:
        rgba(74,222,128,.045);

    color:#86efac;

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:2px;
}

.online-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#4ade80;

    box-shadow:
        0 0 10px #4ade80;
}


/* =========================
   NAME
========================= */

.name{

    font-family:'Space Grotesk',sans-serif;

    font-size:29px;

    font-weight:700;

    letter-spacing:-1px;
}

.check{

    width:20px;
    height:20px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #60a5fa,
            #2563eb
        );

    font-size:9px;

    box-shadow:
        0 0 15px rgba(59,130,246,.35);
}

.tag{

    margin-top:7px;

    font-size:9px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:#f472b6;

    font-weight:700;
}


/* =========================
   DIVIDER
========================= */

.divider{

    display:flex;

    align-items:center;

    gap:12px;

    margin:25px 0;
}

.divider-line{

    flex:1;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12)
        );
}

.divider-line.right{

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.12),
            transparent
        );
}

.divider span{

    font-size:8px;

    letter-spacing:3px;

    color:#52525b;
}


/* =========================
   LINKS
========================= */

.bio-link{

    display:flex;

    align-items:center;

    gap:14px;

    padding:14px;

    border-radius:18px;

    border:
        1px solid rgba(255,255,255,.075);

    background:
        rgba(255,255,255,.035);

    color:white;

    text-decoration:none;

    transition:.3s ease;
}

.bio-link:hover{

    transform:translateY(-3px);

    border-color:
        rgba(236,72,153,.35);

    background:
        rgba(255,255,255,.065);

    box-shadow:
        0 15px 35px rgba(0,0,0,.3);
}

.bio-link:active{

    transform:scale(.98);
}

.icon{

    width:45px;
    height:45px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        rgba(236,72,153,.10);

    color:#f472b6;

    border:
        1px solid rgba(236,72,153,.12);

    font-size:18px;
}

.arrow{

    margin-left:auto;

    color:#52525b;
}

.bio-link:hover .arrow{

    color:#f472b6;

    transform:
        translate(3px,-3px);
}


/* =========================
   FOOTER
========================= */

.footer{

    margin-top:28px;

    padding-top:20px;

    border-top:
        1px solid rgba(255,255,255,.07);
}

.footer-dot{

    display:inline-block;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ec4899;

    margin:0 8px;
}


/* =========================
   MUSIC INTRO
========================= */

#musicIntro{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#050505;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

#musicIntro.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.intro-box{

    text-align:center;

    padding:24px;
}

.intro-logo{

    width:105px;
    height:105px;

    margin:
        0 auto 28px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid rgba(255,255,255,.18);

    box-shadow:
        0 0 50px rgba(236,72,153,.20);
}

.intro-u{

    font-family:'Space Grotesk',sans-serif;

    font-size:64px;

    color:white;
}

.enter-button{

    padding:14px 24px;

    border-radius:50px;

    border:
        1px solid rgba(255,255,255,.16);

    background:
        rgba(255,255,255,.05);

    color:white;

    font-size:11px;

    letter-spacing:3px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

.enter-button:hover{

    background:
        rgba(236,72,153,.15);

    border-color:
        rgba(236,72,153,.5);

    transform:scale(1.03);
}

.music-hint{

    margin-top:16px;

    color:#52525b;

    font-size:10px;

    letter-spacing:1px;
}


/* =========================
   MUSIC BUTTON
========================= */

#musicButton{

    position:fixed;

    right:18px;
    top:18px;

    z-index:1000;

    width:44px;
    height:44px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.14);

    background:
        rgba(15,15,20,.78);

    color:white;

    backdrop-filter:blur(15px);

    cursor:pointer;
}

</style>
</head>


<body>

<!-- ==========================================
     JAVASCRIPT NHẠC
========================================== -->

<script>

const bgMusic =
    document.getElementById("bgMusic");

const musicIntro =
    document.getElementById("musicIntro");

const musicButton =
    document.getElementById("musicButton");


/* Âm lượng */

bgMusic.volume = 0.5;


/* ==========================================
   CHẠM TAP TO ENTER
========================================== */

function enterBio(){

    bgMusic
        .play()
        .catch(() => {});


    musicIntro.classList.add("hide");


    musicButton.innerHTML =
        '<i class="fa-solid fa-volume-high"></i>';

}


/* ==========================================
   BẬT / TẮT NHẠC
========================================== */

function toggleMusic(){

    if(bgMusic.paused){

        bgMusic
            .play()
            .catch(() => {});


        musicButton.innerHTML =
            '<i class="fa-solid fa-volume-high"></i>';

    }

    else{

        bgMusic.pause();


        musicButton.innerHTML =
            '<i class="fa-solid fa-volume-xmark"></i>';

    }

}

</script>
